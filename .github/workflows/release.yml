name: Release

# Pushing a tag like v1.2.3 builds a signed release APK and attaches it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # The keystore lives in the RELEASE_KEYSTORE_BASE64 secret (base64 of the .jks file).
      # app/build.gradle.kts reads the RELEASE_* environment variables set here.
      - name: Restore the release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret is missing, so the APK can't be signed."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Check, test, and build the signed APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew spotlessCheck detekt lint testDebugUnitTest assembleRelease -PversionName="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "practice-speaking-$VERSION.apk"

      - name: Check the APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          if "$APKSIGNER" verify --print-certs practice-speaking-*.apk | grep -q "CN=Android Debug"; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" practice-speaking-*.apk --title "$GITHUB_REF_NAME" --generate-notes
